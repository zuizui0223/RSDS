name: RSDS six native ungulate SOURCE-AGGREGATE archive-only recovery, no GPS
on:
  push:
    branches:
      - analysis/rsds-six-native-month-archive-only-recovery-20261118
    paths:
      - 'research/RSDS_SIX_NATIVE_MONTH_HEAT_ARCHIVE_ONLY_RECOVERY_CONTRACT_20261118.json'
      - 'scripts/aggregate_rsds_two_source_six_native_month_heat_v1.py'
      - 'tests/test_rsds_six_native_archive_only_recovery_v1.py'
      - '.github/workflows/rsds-six-native-month-archive-only-recovery-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  original_two_source_native_signed_artifacts_strict_archive_replay:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Historical group q source helper only, NO original GPS source processing
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Test strict original producer sign schema, native source q algebra and missing/HOLD
        run: python -m unittest discover -s tests -p 'test_rsds_six_native_archive_only_recovery_v1.py' -v
      - name: Verify original first-run source archive artifact ID, ZIP SHA256, original source code Git blob and zero SOURCE GPS data calls
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          from scripts.rsds_437_systematic_source_frame_v1 import git_blob
          c=json.loads(Path('research/RSDS_SIX_NATIVE_MONTH_HEAT_ARCHIVE_ONLY_RECOVERY_CONTRACT_20261118.json').read_text())
          assert c['version']=='RSDS_SIX_NATIVE_ORIGINAL_MONTH_HEAT_ARCHIVE_ONLY_RECOVERY_V1'
          assert c['original_first_action_run_id']==43901281254
          assert c['registered_source_studies']==2
          assert c['registered_source_native_taxon_rows']==6
          assert c['old_48_source_solar_heading_direction_signed_result']=='NOT_REPLICATED'
          assert c['old_12_original_ERA5_raw_SHA_status']=='HOLD'
          assert c['no_raw_GPS_coordinates_tag_ids_precise_dates_individual_coefficients_exported'] is True
          assert c['original_first_source_status_all_complete'] is True
          for prefix in ('original_source_contract','original_source_computation_script'):
              path=Path(c[prefix+'_path'])
              assert path.exists()
              assert git_blob(path.read_bytes())==c[prefix+'_blob'],path
          url='https://api.github.com/repos/zuizui0223/RSDS/actions/runs/43901281254/artifacts?per_page=100'
          req=urllib.request.Request(url,headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as f:
              result=json.load(f)
          artifacts=result['artifacts']
          assert len(artifacts)==2, 'SOURCE_FIRST_ARCHIVE_COUNT_CHANGED'
          indexed={a['name']:a for a in artifacts}
          expected=c['original_first_source_signed_artifacts']
          assert len(expected)==2 and [x['source_index'] for x in expected]==[0,1]
          for x in expected:
              a=indexed[x['artifact_name']]
              assert a['id']==x['artifact_id']
              assert a['digest']==x['digest']
              assert not a['expired']
              assert a['size_in_bytes']>0
          print('ORIGINAL_TWO_SOURCE_FIRST_AGGREGATE_ZIP_DIGESTS_FIXED_NO_GPS_RERUN')
          PY
      - name: Download EXACT TWO original first source-level aggregate JSON archives, not GPS
        uses: actions/download-artifact@v4
        with:
          run-id: 43901281254
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: rsds-source-all-registered-native-month-Tmax-*-v1
          merge-multiple: true
          path: outputs/original_two_studies_first_run
      - name: Repair source-only CI sign field name and aggregate ORIGINAL first six native results
        shell: bash
        run: |
          set -euo pipefail
          ls -lah outputs/original_two_studies_first_run
          python -m scripts.aggregate_rsds_two_source_six_native_month_heat_v1 --directory outputs/original_two_studies_first_run --out research/RSDS_TWO_SOURCE_SIX_NATIVE_WITHIN_MONTH_HEAT_FIRST_RESULT_20261117.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/RSDS_TWO_SOURCE_SIX_NATIVE_WITHIN_MONTH_HEAT_FIRST_RESULT_20261117.json').read_text())
          assert d['original_source_studies']==2
          assert d['original_native_taxon_study_rows']==6
          assert len(d['all_original_six_source_native_rows_including_HOLD'])==6
          assert sum(d['source_native_q_Tmax_sign_counts'].values())==6
          assert sum(d['source_native_day_Tmax_sign_counts'].values())==6
          assert sum(d['source_native_night_Tmax_sign_counts'].values())==6
          assert d['original_source_complete_tag_month_native_rows']==6
          assert all(s['status']=='SOURCE_ALL_NATIVE_ERA5_MONTH_MODELS_EVALUATED' for s in d['original_source_statuses'])
          assert d['new_20261117_ERA5_snapshot_not_old_20261023_or_20261116_raw_physical_equivalence']
          assert d['prior_48_solar_irradiance_heading_direction_not_replicated']
          assert d['prior_12_ERA5_original_raw_SHA_HOLD']
          assert d['no_raw_GPS_weather_animal_ID_individual_effects_or_precise_dates_exported']
          print('SIX_ORIGINAL_UTAH4_WYOMING2_NATIVE_Q_DAY_NIGHT_HEAT_SOURCE_FINAL')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rsds-two-source-six-native-month-first-aggregation-original-archive-recovery-v1
          path: research/RSDS_TWO_SOURCE_SIX_NATIVE_WITHIN_MONTH_HEAT_FIRST_RESULT_20261117.json
          if-no-files-found: error
      - name: Commit first original source-native aggregation without new GPS/ERA5 reads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/RSDS_TWO_SOURCE_SIX_NATIVE_WITHIN_MONTH_HEAT_FIRST_RESULT_20261117.json
          if ! git diff --cached --quiet; then
            git commit -m "results: recover original two source six native heat effects from first signed Actions artifacts"
            git fetch origin analysis/rsds-six-native-month-archive-only-recovery-20261118
            git rebase origin/analysis/rsds-six-native-month-archive-only-recovery-20261118
            git push origin HEAD:analysis/rsds-six-native-month-archive-only-recovery-20261118
          fi
