name: RSDS research provenance and ecological tests
on:
  pull_request:
  push:
    branches:
      - main
      - research/odsp-solar-season-migration-20261026
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'odsp/**'
      - 'research/**'
      - 'provenance/**'
      - 'docs/RSDS_ECOLOGICAL_SYNTHESIS_20261026.md'
      - '.github/workflows/rsds-science-ci.yml'
permissions:
  contents: read
jobs:
  original_research_integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify complete RSDS original ODSP blob identity and immutable heldout result
        run: python -m scripts.verify_rsds_migration
      - name: Install lightweight original seasonal climate numerical dependency
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.11,<2'
      - name: Execute original source-specific model-free ecology tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_solar_irradiance_direction_macro_gradient_v0.py' -v
          python -m unittest discover -s tests -p 'test_solar_radiation_two_24_cohort_diagnostic_v0.py' -v
          python -m unittest discover -s tests -p 'test_global_solar_azimuth_macro_v0.py' -v
          python -m unittest discover -s tests -p 'test_solar_azimuth_weather_study_blocks_v0.py' -v
          python -m unittest discover -s tests -p 'test_solar_wind_irradiance_shared_gps_v0.py' -v
          python -m unittest discover -s tests -p 'test_movebank_solar_movement_20261019.py' -v
          python -m unittest discover -s tests -p 'test_solar_season_macroclimate_20261019.py' -v
      - name: Verify original-source time × solar-direction first result is immutable
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_rsds_cross_axis_generality_v0.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.analyze_rsds_cross_axis_generality_v0 import run, RESULT_PATH
          old = json.loads(Path(RESULT_PATH).read_text(encoding='utf-8'))
          current = run()
          assert old == current, "Original time-direction first result changed without a new route"
          assert current["nine_taxon_solar_heading_repeatability"]["same_joint_circular_covariance_sign"] == 4
          assert current["sunlight_weather_temporal_observation_overlap"]["shared_DOIs_with_diel_daylength_studies"] == 0
          print("RSDS original time/direction macro first receipt is unchanged")
          PY
      - name: Verify RSDS new original same-animal solar time and weather source first result
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_rsds_same_animal_solar_weather_v0.py' -v
          python -m unittest discover -s tests -p 'test_rsds_same_animal_source_synthesis_v0.py' -v
          python - <<'PY'
          import json
          from scripts.analyze_rsds_same_animal_source_results_v0 import (
              ORIGINAL, PREVIOUS, RADIATION, OUTPUT, analyze
          )
          def load(p):
              return json.loads(p.read_text(encoding='utf-8'))
          first=load(ORIGINAL)
          assert first['fixed_original_study_count']==2
          assert first['total_source_native_taxon_rows']==6
          assert all(r['source_original_replayed_before_NEW_weather'] for r in first['sources'])
          new=analyze(first,load(PREVIOUS),load(RADIATION))
          old=load(OUTPUT)
          assert old==new, 'RSDS original first source ecology changed without a separate route'
          assert all(
              row['measured_source_axis_coefficients']['q_daypart_per100W']['sign_support']=='UNRESOLVED_SIGN'
              for row in new['all_taxon_study_results']
          )
          assert new['frozen_external_radiation_nonreplication_UNCHANGED']=='NEGATIVE_DIRECTION_NOT_REPLICATED_IN_HELDOUT_SOURCE_SAMPLE'
          print('RSDS source original same-animal q×Sun×ERA5 first receipts immutable')
          PY
      - name: Verify source-original 269 paired-tag GPS time and Sun-direction geometry v2
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_rsds_same_tag_gps_geometry_v2.py' -v
          python -m unittest discover -s tests -p 'test_rsds_same_tag_gps_geometry_aggregate_v2.py' -v
          python -m unittest discover -s tests -p 'test_rsds_same_tag_gps_geometry_ecology_synthesis_v2.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.summarize_rsds_same_tag_gps_geometry_v2 import run
          p = Path('research/RSDS_SAME_TAG_GPS_GEOMETRY_V2_ECOLOGY_SYNTHESIS_20261026.json')
          old = json.loads(p.read_text(encoding='utf-8'))
          new = run()
          assert old == new, 'RSDS original tagged GPS ecological first interpretation changed'
          assert new['study_units'] == 2 and new['study_taxon_rows'] == 6
          assert new['summed_source_paired_tag_counts_NOT_independent_biomes'] == 269
          assert new['each_axis_nominal_tag_bootstrap95_classification_counts']['joint_circular'] == {'INCLUDES_ZERO':6}
          assert new['earlier_weather_version_holds_preserved'] == 12
          print('RSDS source-original 269 tagged GPS time and solar geometry first ecological receipt locked')
          PY
      - name: Verify 8 original studies, 12 source taxa, frozen pre-event source MD5 and first macro results
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_rsds_new_six_original_gps_preflight_v0.py' -v
          python -m unittest discover -s tests -p 'test_rsds_new_six_original_gps_ecology_v0.py' -v
          python -m unittest discover -s tests -p 'test_rsds_new_six_original_gps_aggregate_v0.py' -v
          python -m unittest discover -s tests -p 'test_rsds_eight_study_temporal_solar_macro_atlas_v1.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_rsds_eight_study_temporal_solar_macro_atlas_v1 import macro
          p = Path('research/RSDS_8_STUDY_TIME_SOLAR_HEADING_MACRO_ATLAS_V1_20261026.json')
          old = json.loads(p.read_text(encoding='utf-8'))
          fresh = macro()
          assert old == fresh, "Eight original study first-result macroecology was modified"
          assert fresh['original_study_denominator']==8 and fresh['source_taxon_rows']==12
          assert fresh['source_taxa_with_q']==11 and fresh['source_taxa_with_solar_raw']==10
          assert fresh['source_taxa_with_paired_original_tags']==9
          assert fresh['source_tag_context_pair_occurrences_NOT_global_biomes']==288
          assert fresh['old_48_radiation_study_external_negative_direction_test_UNCHANGED'] == 'NEGATIVE_DIRECTION_NOT_REPLICATED_IN_HELDOUT_SOURCE_SAMPLE'
          assert fresh['old_12_ERA5_provider_raw_SHA_HOLDS_UNCHANGED'] is True
          print('RSDS eight original GPS field-study macro ecology SHA-locked unchanged, all source holds preserved')
          PY
      - name: Verify source-equal eight original GPS study macro weighting and hold-proof conclusions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_rsds_source_equal_eight_study_macro_v1.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.source_equal_rsds_eight_study_temporal_solar_v1 import run
          p=Path('research/RSDS_EIGHT_STUDY_SOURCE_EQUAL_MACRO_SENSITIVITY_FIRST_RESULT_20261026.json')
          previous=json.loads(p.read_text(encoding='utf-8'))
          current=run()
          assert previous==current, 'Previously pinned eight original study weighting sensitivity changed'
          q=current['source_equal_axes']['night_day_q']
          assert q['original_studies_with_supported_axis']==7
          assert q['original_source_taxon_rows_with_supported_axis']==11
          assert q['supported_original_source_signs']=={'positive':4,'negative':3,'exact_zero':0}
          assert current['source_equal_axes']['joint_circular_covariance']['source_resampling_interval_available'] is False
          assert current['old_external_shortwave_direction_nonreplication_UNCHANGED']=='NEGATIVE_DIRECTION_NOT_REPLICATED_IN_HELDOUT_SOURCE_SAMPLE'
          assert current['old_12_ERA5_provider_source_SHA_HOLDS_UNCHANGED']
          print('RSDS original source DOI-equal macro estimand and all older source HOLDS unchanged')
          PY
      - name: Validate canonical ERA5 UTC hourly physical data and two real fixed-site provider source responses
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_rsds_era5_canonical_physical_content_v1.py' -v
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          p=Path('research/RSDS_ERA5_CANONICAL_BENCHMARK_FIRST_RESULT_20261028.json')
          raw=p.read_bytes()
          sha=hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()
          assert sha=='31f54cdb07c847d3cd0f0d73cdc572693bd22858','First original ERA5 benchmark result changed'
          d=json.loads(raw)
          assert d['public_no_GPS_source_benchmarks']==2
          assert d['two_valid_requests_per_site_completed']==2
          assert d['raw_JSON_SHA_disagreements']==2
          assert d['stable_hourly_physical_content_despite_raw_JSON_mismatch']==2
          assert sorted(x['UTC_hours_verified'] for x in d['benchmarks'])==[8760,8784]
          for site in d['benchmarks']:
              assert site['physical_hourly_numeric_SHA_identical'] is True
              assert site['returned_weather_grid_metadata_identical'] is True
              assert site['raw_response_SHA_identical'] is False
              assert all(n==0 for n in site['hours_differing_by_field'].values())
          assert d['old_12_original_source_ERA5_version_HOLDS_UNCHANGED'] is True
          assert d['old_48_source_external_signed_radiation_NONREPLICATED_UNCHANGED']=='NEGATIVE_DIRECTION_NOT_REPLICATED_IN_HELDOUT_SOURCE_SAMPLE'
          print('ERA5 2 independent benchmarks: raw JSON hash differs yet UTC-hourly physics unchanged; old source holds preserved')
          PY
      - name: Verify original GPS MD5/q/daylength source-class ERA5 12-context physical first result is preserved
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_rsds_original_source_era5_physical_version_v1.py' -v
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('research/RSDS_ERA5_ORIGINAL_SOURCES_CANONICAL_FIRST_RESULT_20261028.json')
          raw=p.read_bytes()
          sha=hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()
          assert sha=='d39a1ee209ca81a895df6115110759ee4d0acd84','Original GPS weather numeric first source result changed'
          d=json.loads(raw)
          assert d['original_studies']==2 and d['original_study_taxon_groups']==6
          assert d['original_selected_weather_contexts_reconstructed']==12
          assert d['current_provider_contexts_two_response_comparisons']==12
          assert d['within_current_session_raw_JSON_sha_mismatch']==12
          assert d['within_current_session_canonical_UTC_hourly_values_equal']==12
          assert d['within_current_session_raw_json_diff_but_physical_and_grid_equal']==12
          assert d['CURRENT_raw_SHA_matches_historic_v0_raw_SHA_first_response']==0
          assert d['baseline_raw_JSON_SHA_historical_replay_HOLD_contexts']==12
          assert d['baseline_physical_content_OLD_vs_NEW']=='NOT_IDENTIFIABLE_OLD_HOURLY_NUMERIC_VALUES_NOT_ARCHIVED'
          assert d['original_48_study_external_negative_shortwave_replication_UNCHANGED']=='NEGATIVE_DIRECTION_NOT_REPLICATED_IN_HELDOUT_SOURCE_SAMPLE'
          assert all(s['GPS_MD5_replayed'] and s['original_native_temporal_results_replayed_before_weather'] for s in d['source_study_results'])
          print('12 original GPS-selected ERA5 current physical arrays stable; old physical data unknown and negative external verdict unchanged')
          PY
      - name: Pin original q/sun-direction 36 contextual coefficients and 18 taxon means on NEW canonical physical ERA5 version
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_rsds_canonical_era5_same_tag_ecology_v2.py' -v
          python -m unittest discover -s tests -p 'test_rsds_canonical_v2_old_v0_effect_replay_v1.py' -v
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from scripts.compare_rsds_canonical_v2_old_v0_biology_v1 import run
          paths = {
            'research/RSDS_CANONICAL_ERA5_SAME_TAG_ECOLOGY_V2_FIRST_RESULT_20261028.json':
              'ac87bdab689567ed145aa91ed8d24bab8cdce4f1',
            'research/RSDS_CANONICAL_ERA5_V2_OLD_V0_EFFECT_REPLAY_AND_TAG_PAIRS_20261028.json':
              '25ad21d46d79a0755acd849cf1773d378d56e17d',
          }
          for path, expected in paths.items():
              raw = Path(path).read_bytes()
              sha = hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()
              assert sha == expected, f'First original source ecological result modified: {path}'
          old = json.loads(Path(list(paths)[1]).read_text(encoding='utf-8'))
          fresh = run()
          assert old == fresh, 'Original GPS shortwave effect numerical replay changed'
          assert fresh['native_original_context_and_three_axis_comparisons'] == 36
          assert fresh['native_original_source_animal_mean_comparisons'] == 18
          assert fresh['max_abs_new_vs_old_original_context_fitted_coefficient_difference'] < 1e-12
          assert fresh['max_abs_new_vs_old_original_source_tag_means_difference'] < 1e-12
          assert fresh['historic_12_raw_JSON_SHA_source_HOLDS_UNCHANGED'] is True
          assert fresh['old_v0_weather_physical_array_identity'] == 'NOT_IDENTIFIABLE_FROM_UNARCHIVED_HISTORIC_HOURLY_ARRAYS'
          assert fresh['historical_external_negative_radiation_nonreplication_UNCHANGED'] == 'NEGATIVE_DIRECTION_NOT_REPLICATED_IN_HELDOUT_SOURCE_SAMPLE'
          print('36 contexts + 18 source tag means numerically reproduced; old physical version and nonreplication safeguarded')
          PY
      - name: Guard original eight-study UTC fix-clock parity alias and qualified-tag q sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_rsds_eight_study_gps_cadence_v1.py' -v
          python -m unittest discover -s tests -p 'test_rsds_eight_study_gps_cadence_aggregate_v1.py' -v
          python -m unittest discover -s tests -p 'test_rsds_gps_utc_phase_alias_v1.py' -v
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from scripts.summarize_rsds_gps_utc_phase_alias_v1 import analyze
          sources={
             'research/RSDS_EIGHT_STUDY_GPS_CADENCE_MATCHED_DAY_FIRST_RESULT_20261028.json':
                '8b93fe361eccbdc13647e465ddfaa24ad10c7c98',
             'research/RSDS_EIGHT_STUDY_GPS_CADENCE_PHASE_ALIAS_DIAGNOSTIC_20261028.json':
                '670199d6a40f3271f2fffa896c1e9971c66a737c',
          }
          for p,expected in sources.items():
              raw=Path(p).read_bytes()
              sha=hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()
              assert sha==expected, f'Original UTC GPS source result has changed {p}'
          data=json.loads(Path(list(sources)[1]).read_text(encoding='utf-8'))
          assert data == analyze()
          assert data['original_field_studies']==8 and data['source_taxon_rows']==12
          assert data['source_cohorts_with_native_UTC_phase_fix_schedule_imbalance_below_20pct']==4
          assert data['source_cohorts_with_near_balanced_UTC_phase_fix_schedule']==7
          assert len(data['native_taxa_with_opposite_nominal_signed_q_cadence_effects_between_even_odd_UTC_phases'])==2
          assert data['historical_12_ERA5_source_version_HOLDS_UNCHANGED'] is True
          assert data['historic_48_source_sunlight_direction_external_NONREPLICATED_UNCHANGED']=='NEGATIVE_DIRECTION_NOT_REPLICATED_IN_HELDOUT_SOURCE_SAMPLE'
          print('UTC parity alias 4/11 original cohorts; opposite phase-specific q biases in both Wyoming taxa; all original study HOLDS unchanged')
          PY
      - name: Preserve 8 original GPS studies triple exact matched tag dates and observed UTC acquisition phase bias
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_rsds_gps_three_phase_exact_dates_v2.py' -v
          python -m unittest discover -s tests -p 'test_rsds_three_phase_exact_original_aggregate_v2.py' -v
          python -m unittest discover -s tests -p 'test_rsds_triple_exact_date_empirical_synthesis_v2.py' -v
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from scripts.summarize_rsds_three_phase_original_ecology_v2 import run
          known={
            'research/RSDS_GPS_THREE_PHASE_EXACT_TAG_DATE_V2_FIRST_RESULT_20261028.json':
              'da679f8ca8d973de7da55463e5643037df6a0579',
            'research/RSDS_GPS_TRIPLE_DATE_CADENCE_ECOLOGICAL_INTERPRETATION_V2_20261028.json':
              '2a608374131e7a2271fd8418f239bb37446d54ba',
          }
          for p,expect in known.items():
              raw=Path(p).read_bytes()
              sha=hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()
              assert sha==expect, f'Original tagged animal GPS three UTC phase result changed: {p}'
          first=json.loads(Path(list(known)[0]).read_text(encoding='utf-8'))
          old=json.loads(Path(list(known)[1]).read_text(encoding='utf-8'))
          assert old==run(), 'First source-derived clock bias interpretation changed'
          assert first['fixed_original_source_studies']==8
          assert first['native_source_study_taxon_rows']==12
          assert old['qualifying_same_tag_original_three_phase_source_taxon_rows']==8
          assert old['qualified_original_source_taxa_with_positive_even_minus_odd_q']['n']==3
          assert old['original_Wyoming_two_native_taxa_exact_three_phase_recurrence']['Odocoileus hemionus']['original_triply_matched_tag_count']==113
          assert old['original_Wyoming_two_native_taxa_exact_three_phase_recurrence']['Ovis canadensis']['original_triply_matched_tag_count']==41
          assert old['previous_12_ERA5_source_json_version_HOLDS_UNCHANGED']
          assert old['previous_48_source_signed_sunlight_external_NONREPLICATED_UNCHANGED']=='NEGATIVE_DIRECTION_NOT_REPLICATED_IN_HELDOUT_SOURCE_SAMPLE'
          print('8 original GPS source DOI and exact same original tag/year/date q UTC phase effects locked with all holds')
          PY
      - name: Lock original eight-study temporal q and q~daylength ecological signs on identical animal dates across three GPS clocks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_rsds_triple_q_photoperiod_levels_v1.py' -v
          python -m unittest discover -s tests -p 'test_rsds_triple_ecological_q_invariance_aggregate_v1.py' -v
          python -m unittest discover -s tests -p 'test_rsds_full_vs_triple_ecological_q_v1.py' -v
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from scripts.audit_rsds_full_vs_matched_temporal_ecology_v1 import run
          first={
              'research/RSDS_TRIPLE_DATE_ECOLOGICAL_Q_DAYLENGTH_INVARIANCE_V1_FIRST_RESULT_20261028.json':
                  '157af4cacbe4359b07f4cedbed2793f8c49972b3',
              'research/RSDS_TRIPLE_DATE_VS_ORIGINAL_ECOLOGICAL_TIME_SIGN_AUDIT_20261028.json':
                  '3142224a80951ccac06b4eb35a91319a187dbc8d'
          }
          for name,expected in first.items():
              raw=Path(name).read_bytes()
              sha=hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()
              assert sha==expected, f'Original eight-study source temporal ecology first result changed: {name}'
          d=json.loads(Path(list(first)[1]).read_text(encoding='utf-8'))
          assert d==run()
          assert d['original_field_study_doi_count']==8 and d['source_taxon_rows']==12
          assert d['full_vs_triple_q_support_sign_count']['SAME_SIGN_SUPPORTED_IN_FULL_AND_ALL_THREE_SCHEDULES_POSITIVE']==3
          assert d['full_vs_triple_q_support_sign_count']['SAME_SIGN_SUPPORTED_IN_FULL_AND_ALL_THREE_SCHEDULES_NEGATIVE']==2
          assert d['full_vs_triple_daylength_slope_sign_count']['SAME_SIGN_SUPPORTED_IN_FULL_AND_ALL_THREE_SCHEDULES_POSITIVE']==2
          assert d['n_distinct_original_field_studies_with_q_sign_supported_in_full_and_all_three_schedules']==5
          assert d['n_distinct_original_field_studies_with_daylength_sign_supported_in_full_and_all_three_schedules']==2
          assert d['old_12_ERA5_serialized_raw_SHA_HOLDS_UNCHANGED'] is True
          assert d['old_48_source_external_signed_radiation_nonreplication_UNCHANGED']=='NEGATIVE_DIRECTION_NOT_REPLICATED_IN_HELDOUT_SOURCE_SAMPLE'
          print('RSDS five source q and two original source q~daylength signed ecology results retained; exact animal-day support and negative climate source unchanged')
          PY
      - name: Guard Wyoming same original study 193 shared calendar days and two opposite photoperiod q slopes
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_rsds_wyoming_coobserved_photoperiod_v1.py' -v
          python -m unittest discover -s tests -p 'test_rsds_wyoming_shared_season_first_result_v1.py' -v
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from scripts.validate_rsds_wyoming_shared_season_ecology_v1 import validate
          locked={
            'research/RSDS_WYOMING_COOCCURRENT_DATES_PHOTOPERIOD_V1_FIRST_RESULT_20261029.json':
              '9b04b18ee73227b4e7a1715ebfb97f610af66952',
            'research/RSDS_WYOMING_SHARED_SEASON_DIVERGENT_PHOTOPERIOD_VALIDATION_V1_20261029.json':
              'e7979c5ff720597704903254ec6f8ee33332b1ae',
          }
          for p,expected in locked.items():
              raw=Path(p).read_bytes()
              sha=hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()
              assert sha==expected, f'Original Wyoming shared-calendar source result changed: {p}'
          original=json.loads(Path(list(locked)[0]).read_text(encoding='utf-8'))
          summarized=json.loads(Path(list(locked)[1]).read_text(encoding='utf-8'))
          assert summarized==validate(), 'Wyoming original native taxon photoperiod interpretation changed'
          assert original['status']=='STUDY_COMMON_DATE_EVALUATED'
          assert original['original_provider_GPS_MD5_verified']
          assert original['both_native_taxa_original_all_date_and_original_triple_source_estimates_replayed']
          assert summarized['original_field_study_replications']==1
          assert summarized['source_coobserved_calendar_dates']==193
          assert summarized['original_taxon_source_tagged_95pct_results']['Odocoileus hemionus']['source_original_tag_n']==108
          assert summarized['original_taxon_source_tagged_95pct_results']['Ovis canadensis']['source_original_tag_n']==41
          assert summarized['all_three_GPS_schedules_show_mule_positive_bighorn_negative_and_positive_contrast']
          assert summarized['previous_twelve_ERA5_raw_source_version_HOLDS_UNCHANGED']
          assert summarized['previous_forty_eight_source_negative_direction_verdict_UNCHANGED']=='NEGATIVE_DIRECTION_NOT_REPLICATED_IN_HELDOUT_SOURCE_SAMPLE'
          print('Wyoming 193 shared calendar dates; 108 mule deer and 41 bighorn tags; 3 GPS clocks opposite q/daylength signs, old holds frozen')
          PY
      - name: Pin two original source native ungulate shared-calendar q rank and seasonal photoperiod nonrecurrence
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_rsds_utah_coobserved_photoperiod_v1.py' -v
