name: RSDS original same-tagged-animal context sensitivity v1
on:
  push:
    branches:
      - science/within-tag-context-heterogeneity-v1
    paths:
      - 'scripts/run_rsds_same_tag_context_pair_v1.py'
      - 'scripts/aggregate_rsds_same_tag_context_pair_v1.py'
      - 'tests/test_rsds_same_tag_context_pair_v1.py'
      - 'tests/test_rsds_same_tag_context_pair_aggregate_v1.py'
      - 'research/RSDS_SAME_TAG_CONTEXT_PAIR_V1_CONTRACT.json'
      - '.github/workflows/rsds-same-tag-context-pair-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  support_gate_and_known_truth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science/within-tag-context-heterogeneity-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical runtime for original directional and q residualization
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Exact source-v0 integrity from source result and preserved historical denial
        run: python -m scripts.verify_rsds_migration
      - name: Test paired-tag statistical unit, source context replay and all-holds preservation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_rsds_same_tag_context_pair_v1.py' -v
          python -m unittest discover -s tests -p 'test_rsds_same_tag_context_pair_aggregate_v1.py' -v
          python -m unittest discover -s tests -p 'test_rsds_same_animal_solar_weather_v0.py' -v
  original_source_tagged_contexts:
    needs: support_gate_and_known_truth
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        region: [Utah, Wyoming]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science/within-tag-context-heterogeneity-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source weather/regression numerical dependency
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Validate original provider MD5 and replay prior source results before any ERA5 SHA-locked matched tag analysis
        run: |
          python -m scripts.run_rsds_same_tag_context_pair_v1 --region ${{ matrix.region }} --out outputs/rsds_tagged_context
      - name: Retain original source-specific full coverage including weather-version holds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsds-tag-${{ matrix.region }}-original-context-v1
          path: outputs/rsds_tagged_context/source_*.json
          if-no-files-found: warn
  original_source_paired_context_synthesis:
    needs: original_source_tagged_contexts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science/within-tag-context-heterogeneity-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: rsds-tag-*-original-context-v1
          merge-multiple: true
          path: outputs/rsds_tagged_context
      - name: Preserve six original source taxa regardless of provider version holds
        run: |
          python -m scripts.aggregate_rsds_same_tag_context_pair_v1 --input outputs/rsds_tagged_context --out research/RSDS_SAME_TAG_CONTEXT_PAIR_V1_FIRST_RESULT_20261026.json
          python -m json.tool research/RSDS_SAME_TAG_CONTEXT_PAIR_V1_FIRST_RESULT_20261026.json > /dev/null
      - name: Source-only group result artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsds-same-tag-context-pair-synthesis-v1
          path: research/RSDS_SAME_TAG_CONTEXT_PAIR_V1_FIRST_RESULT_20261026.json
          if-no-files-found: error
      - name: Commit frozen original source aggregate result without animal identifiers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/RSDS_SAME_TAG_CONTEXT_PAIR_V1_FIRST_RESULT_20261026.json
          if ! git diff --cached --quiet; then
            git commit -m "results: same original tagged-animal cross-context supported and unavailable effects"
            git push origin HEAD:science/within-tag-context-heterogeneity-v1
          fi
