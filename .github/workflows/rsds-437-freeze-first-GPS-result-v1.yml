name: RSDS freeze first 16-source GPS result from original successful Actions artifact
on:
  push:
    branches:
      - analysis/rsds-437-source-frame-wave1-20261115
    paths:
      - '.github/workflows/rsds-437-freeze-first-GPS-result-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  preserve_first_original_source_result_without_reopening_GPS:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve prior SUCCESS workflow original source first-result artifact without re-running GPS
        uses: actions/download-artifact@v4
        with:
          run-id: 43690283579
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: rsds-437-wave1-native-q-multi-source-meta-atlas-v1
          path: outputs/first_source_receipt
      - name: Verify original source first JSON SHA, complete native denominations and scientific HOLDS
        shell: bash
        run: |
          set -euo pipefail
          cp outputs/first_source_receipt/rsds_437_wave1_original_gps_first_all_results_v1.json research/RSDS_437_WAVE1_16_SOURCE_GPS_FIRST_ALL_RESULTS_20261115.json
          echo "8e023272683b2f46ab30c35ec62632eab17b5e0aef89c49f774d03d98f114c6c  research/RSDS_437_WAVE1_16_SOURCE_GPS_FIRST_ALL_RESULTS_20261115.json" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/RSDS_437_WAVE1_16_SOURCE_GPS_FIRST_ALL_RESULTS_20261115.json")
          d=json.loads(p.read_text())
          assert d["original_catalog_package_count"] == 437
          assert d["original_GPS_GNSS_candidates"] == 259
          assert d["metadata_eligible_finite_frame"] == 120
          assert d["original_selection_wave_slots"] == 16
          assert d["original_source_metadata_file_HOLD_slots"] == 3
          assert len(d["all_first_wave_source_study_summaries"]) == 16
          assert len(d["all_first_wave_registered_native_group_effects"]) == 27
          assert d["source_status_counts"] == {
             "ORIGINAL_SOURCE_GPS_HOLD":2,
             "ORIGINAL_SOURCE_GPS_Q_ESTIMABLE":6,
             "ORIGINAL_SOURCE_GPS_Q_UNAVAILABLE_NOT_ZERO":5,
             "PRE_EVENT_ORIGINAL_FILE_METADATA_HOLD":3
          }
          assert d["stratified_source_complete_effect_sensitivity"]["q"]["first_wave_source_complete_response"] == 4
          assert d["stratified_source_complete_effect_sensitivity"]["daylength"]["first_wave_source_complete_response"] == 3
          assert sum(x["native_covariance_status"]=="SOURCE_NATIVE_COMMON_CALENDAR_JOINT_COVARIANCE_ESTIMATED" for x in d["all_first_wave_source_study_summaries"]) == 0
          assert d["not_a_world_population_meta_analysis"] is True
          print("SHA-pinned original first source telemetry aggregate, 16/16 sources, 27 native labels, and all scientific HOLDS unchanged")
          PY
      - name: Commit original first biological output by sha, not rerun, to non-main science branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/RSDS_437_WAVE1_16_SOURCE_GPS_FIRST_ALL_RESULTS_20261115.json
          if ! git diff --cached --quiet; then
            git commit -m "results: freeze original first 16-source GPS effects and all HOLDs (artifact SHA exact)"
            git fetch origin analysis/rsds-437-source-frame-wave1-20261115
            git rebase origin/analysis/rsds-437-source-frame-wave1-20261115
            git push origin HEAD:analysis/rsds-437-source-frame-wave1-20261115
          fi
