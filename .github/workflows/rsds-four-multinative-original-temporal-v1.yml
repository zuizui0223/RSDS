name: RSDS four new original multi-native GPS time niche and shared calendar ecology
on:
  push:
    branches:
      - science/four-multinative-gps-temporal-outcomes-v1
    paths:
      - 'scripts/run_rsds_four_new_multinative_original_gps_temporal_v1.py'
      - 'scripts/aggregate_rsds_four_new_multinative_temporal_v1.py'
      - 'tests/test_rsds_four_multinative_original_q_calendar_v1.py'
      - 'tests/test_rsds_four_multinative_original_temporal_aggregate_v1.py'
      - 'research/RSDS_FOUR_NEW_MULTINATIVE_SOURCE_PRE_EVENT_SHA_LOCK_V1.json'
      - '.github/workflows/rsds-four-multinative-original-temporal-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source_only_seal_and_known_truth:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science/four-multinative-gps-temporal-outcomes-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing original GPS time-niche numerical runtime
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Verify old 390 original migrated source result SHA identities and historic external failure
        run: python -m scripts.verify_rsds_migration
      - name: Validate four pre-event metadata frozen source files, pair and native date support known truth
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_rsds_four_new_multitaxon_source_metadata_v1.py' -v
          python -m unittest discover -s tests -p 'test_rsds_four_multinative_original_q_calendar_v1.py' -v
          python -m unittest discover -s tests -p 'test_rsds_four_multinative_original_temporal_aggregate_v1.py' -v
          python - <<'PY'
          from scripts.run_rsds_four_new_multinative_original_gps_temporal_v1 import fixed_sources
          c,entries=fixed_sources()
          assert len(c['sources'])==4
          assert sum(len(x['registered_taxa']) for x in c['sources'])==10
          assert len(entries)==4
          assert all(x['source_status']=='SOURCE_ONLY_ORIGINAL_FILE_ADMISSIBLE' for x in entries)
          assert all(x['original_animal_events_opened_before_file_freeze']==0 for x in entries)
          print('FOUR fixed source original files SHA/MD5 frozen before opening native GPS temporal outcomes')
          PY
  four_original_source_events:
    needs: source_only_seal_and_known_truth
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        index: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science/four-multinative-gps-temporal-outcomes-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original astronomy and q regression numerical runtime
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Verify exact publisher source bitstream MD5; process all native source taxa and common calendar original GPS
        run: |
          python -m scripts.run_rsds_four_new_multinative_original_gps_temporal_v1 --index ${{ matrix.index }} --out outputs/four_new_multinative_gps
      - name: Retain source group-only q and shared date/photoperiod or source HOLD results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsds-original-multinative-source-${{ matrix.index }}-v1
          path: outputs/four_new_multinative_gps/study_${{ matrix.index }}_original_multinative_q_v1.json
          if-no-files-found: warn
  original_four_study_ten_native_temporal_ecology_aggregate:
    needs: four_original_source_events
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science/four-multinative-gps-temporal-outcomes-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original source q/daylength helper import requirements
        run: python -m pip install 'numpy>=1.24,<3'
      - uses: actions/download-artifact@v4
        with:
          pattern: rsds-original-multinative-source-*-v1
          merge-multiple: true
          path: outputs/four_new_multinative_gps
      - name: Preserve original source 4 DOI and all 10 native taxa, no source/taxon replacement
        run: |
          python -m scripts.aggregate_rsds_four_new_multinative_temporal_v1 --input outputs/four_new_multinative_gps --out research/RSDS_FOUR_NEW_MULTINATIVE_GPS_SHARED_CALENDAR_V1_FIRST_RESULT_20261029.json
          python -m json.tool research/RSDS_FOUR_NEW_MULTINATIVE_GPS_SHARED_CALENDAR_V1_FIRST_RESULT_20261029.json > /dev/null
      - name: Check no original GPS individual identifiers or precise location, date/time exposed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('research/RSDS_FOUR_NEW_MULTINATIVE_GPS_SHARED_CALENDAR_V1_FIRST_RESULT_20261029.json').read_text(encoding='utf-8'))
          assert z['fixed_original_published_studies']==4
          assert z['registered_original_study_native_taxon_rows']==10
          assert z['prior_12_ERA5_version_source_HOLDS_UNCHANGED'] is True
          assert z['prior_48_source_shortwave_direction_NEGATIVE_EXTERNAL_REPLICATION_UNCHANGED']=='NEGATIVE_DIRECTION_NOT_REPLICATED_IN_HELDOUT_SOURCE_SAMPLE'
          def walk(y):
              if isinstance(y,dict):
                  for k,v in y.items():
                      assert k not in {'tag_id','animal_id','individual_id','utc_hour','timestamp','calendar_date','source_day','latitude','longitude','location-lat','location-long','original_gps_fixes','per_animal','raw_tracks'}
                      walk(v)
              elif isinstance(y,list):
                  for v in y:walk(v)
          walk(z)
          print('FOUR original study ten native cohort source-only group results, no original GPS events published')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rsds-four-independent-original-multitaxon-shared-date-time-niche-v1
          path: research/RSDS_FOUR_NEW_MULTINATIVE_GPS_SHARED_CALENDAR_V1_FIRST_RESULT_20261029.json
          if-no-files-found: error
      - name: Commit only all four source study group results preserving source-first MD5 receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/RSDS_FOUR_NEW_MULTINATIVE_GPS_SHARED_CALENDAR_V1_FIRST_RESULT_20261029.json
          if ! git diff --cached --quiet; then
            git commit -m "results: original four new Movebank multisp q and shared calendar temporal niche comparison"
            git fetch origin science/four-multinative-gps-temporal-outcomes-v1
            git rebase origin/science/four-multinative-gps-temporal-outcomes-v1
            git push origin HEAD:science/four-multinative-gps-temporal-outcomes-v1
          fi
